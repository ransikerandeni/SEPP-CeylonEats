name: Browser end-to-end tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # playwright.config.ts prepares its own throwaway schema in this database,
    # then builds the client and serves it with the API from a single origin.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ceylon
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: ceylon_eats
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://ceylon:local_dev_only@127.0.0.1:5432/ceylon_eats

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'

      - run: npm ci

      - name: Install the Chromium build Playwright expects
        run: npx playwright install --with-deps chromium

      - name: Run the browser suite
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
