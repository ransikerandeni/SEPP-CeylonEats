services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lanka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lanka_table
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanka -d lanka_table"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
